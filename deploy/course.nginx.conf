# PyQuest — course.azizbek-azimov.uz
# Кладётся в /etc/nginx/sites-available/course, символьная ссылка в sites-enabled.
# HTTPS-блок добавляет certbot --nginx автоматически.
server {
    listen 80;
    listen [::]:80;
    server_name course.azizbek-azimov.uz;

    root /var/www/course;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML всегда перепроверять (кэш-бастинг через ?v= в ссылках)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Кэш статики
    location ~* \.(css|js|png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Рантаймы компиляторов (clang/lld/sysroot для C и C++).
    # В mime.types этого nginx нет типа wasm, а WebAssembly.compileStreaming
    # принимает только application/wasm — объявляем тип локально, в своём vhost.
    location /wasm/ {
        types { application/wasm wasm; }
        default_type application/octet-stream;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
}
